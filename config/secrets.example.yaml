# Copy to secrets.yaml. Replace every YOUR_* value and keep the quotes.
# 复制为 secrets.yaml，替换每个 YOUR_* 占位符并保留引号。
# Keep real credentials local; never put them in this example.
# 真实凭证仅保存在本地，不能写入此示例。

# Required: Steam Web API key. 必填：Steam Web API Key。
api_key: "YOUR_STEAM_WEB_API_KEY"

# Required: 17-digit SteamID64 as a string. 必填：17 位 SteamID64 字符串。
steamid: "YOUR_STEAM_ID_64"

# Required: full steamLoginSecure cookie. 必填：steamLoginSecure Cookie 完整值。
steam_login_secure: "YOUR_STEAM_LOGIN_SECURE_COOKIE"

# Required: sessionid cookie from the same session. 必填：同一会话的 sessionid Cookie。
sessionid: "YOUR_SESSION_ID_COOKIE"

# Optional: full steamCountry cookie; defaults to HK when omitted.
# 可选：steamCountry Cookie 完整值，省略时默认 HK。
# The YAML key is steam_country_cookie, not steamCountry.
# YAML 键名必须为 steam_country_cookie，不能写成 steamCountry。
steam_country_cookie: "HK"
